[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [goldmark.parser.attribute]
      block = true

  # Posts embed raw HTML (<img>, <div>, <table>) that must be passed through
  [goldmark.renderer]
    unsafe = true

  # Leave math untouched for MathJax. \[ \] is not a delimiter here because
  # posts use it as escaped brackets in plain text.
  [goldmark.extensions.passthrough]
    enable = true
    [goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$'], ['\(', '\)']]

  [goldmark.extensions.footnote]
    enable = true

  # Korean particles attach directly to emphasis (**"..."**를), which CommonMark
  # won't close. Write **"..."**\ 를 instead: the escaped space counts as
  # whitespace for delimiter flanking but is not rendered.
  [goldmark.extensions.cjk]
    enable = true
    escapedSpace = true

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4
